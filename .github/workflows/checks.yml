name: Checks

on:
  pull_request:
  push:
    branches: [codex/initial-smart-pantry]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --legacy-peer-deps
      - run: npm run audit:security
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:rules
      - name: Check Expo compatibility
        run: npx expo install --check
      - name: Package web
        run: npx expo export --platform web --output-dir dist
        env:
          EXPO_PUBLIC_FIREBASE_API_KEY: test-api-key
          EXPO_PUBLIC_FIREBASE_PROJECT_ID: test-project
          EXPO_PUBLIC_FIREBASE_APP_ID: '1:123:web:test'
      - name: Package Android JavaScript
        run: npx expo export --platform android --output-dir work/export-android
        env:
          EXPO_PUBLIC_FIREBASE_API_KEY: test-api-key
          EXPO_PUBLIC_FIREBASE_PROJECT_ID: test-project
          EXPO_PUBLIC_FIREBASE_APP_ID: '1:123:web:test'
